<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あじ・彩・感 店舗からのお知らせ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f4f6f4;
      color: #333333;
    }
    .header {
      background-color: #1b7a43;
      color: #ffffff;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 1px;
    }
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .news-card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
      border-left: 6px solid #1b7a43;
    }
    .news-card.important {
      border-left-color: #d32f2f;
      background-color: #fffaf0;
    }
    .news-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .news-date {
      font-size: 14px;
      color: #666666;
      font-weight: bold;
    }
    .news-tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      background-color: #e8f5e9;
      color: #1b5e20;
      font-weight: bold;
    }
    .news-card.important .news-tag {
      background-color: #ffebee;
      color: #c62828;
    }
    .news-title {
      font-size: 19px;
      font-weight: bold;
      color: #111111;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .news-body {
      font-size: 16px;
      color: #444444;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    #loading {
      text-align: center;
      padding: 50px 20px;
      font-size: 18px;
      color: #666;
    }
    .empty-message {
      text-align: center;
      padding: 40px 20px;
      color: #777;
      font-size: 16px;
      background: #fff;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div id="loading">お知らせを読み込み中...</div>

  <div id="content" style="display: none;">
    <div class="header">
      <h1>📢 店舗からのお知らせ</h1>
    </div>

    <div class="news-list" id="newsList"></div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzxknLHXEn2z71x1Ms6i3eyA4kgbGSgxRTlhkKQ-gp0R-2f0wlio0ew2biquafEyAfB/exec?type=news";

    fetch(GAS_API_URL)
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        const newsList = document.getElementById('newsList');

        if (!data.news || data.news.length === 0) {
          newsList.innerHTML = '<div class="empty-message">現在、新しいお知らせはありません。</div>';
          return;
        }

        data.news.forEach(item => {
          const card = document.createElement('div');
          const isImportant = item.isImportant || item.title.includes('重要');
          card.className = 'news-card' + (isImportant ? ' important' : '');

          card.innerHTML = `
            <div class="news-meta">
              <span class="news-date">📅 ${item.date}</span>
              ${isImportant ? '<span class="news-tag">重要</span>' : '<span class="news-tag">案内</span>'}
            </div>
            <div class="news-title">${item.title}</div>
            <div class="news-body">${item.body}</div>
          `;
          newsList.appendChild(card);
        });
      })
      .catch(error => {
        document.getElementById('loading').textContent = 'お知らせの読み込みに失敗しました。時間をおいて再読み込みしてください。';
        console.error(error);
      });
  </script>
</body>
</html>
